<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Web Calculator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <div class="background-decor">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="app-container">
    <main class="calculator-card">
      <!-- Top Navigation / Status Header -->
      <header class="calc-header">
        <div class="brand">
          <span class="brand-icon">🐍</span>
          <span class="brand-name"><strong>Calculator</strong></span>
        </div>

        <div class="header-controls">
          <!-- Mode Tabs -->
          <div class="mode-switch" role="tablist">
            <button id="btnStandardMode" class="tab-btn active" role="tab" aria-selected="true" title="Standard Mode">Standard</button>
            <button id="btnScientificMode" class="tab-btn" role="tab" aria-selected="false" title="Scientific Mode">Scientific</button>
          </div>

          <!-- Angle Toggle (DEG / RAD) -->
          <button id="btnAngleMode" class="badge-btn" title="Toggle Angle Mode (Degrees / Radians)">
            <span class="badge-label">DEG</span>
          </button>

          <!-- History Drawer Toggle -->
          <button id="btnToggleHistory" class="icon-btn" title="View History (Ctrl+H)" aria-label="Toggle History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 14 14"></polyline>
            </svg>
          </button>

          <!-- Shortcuts Info Modal Toggle -->
          <button id="btnShowHelp" class="icon-btn" title="Keyboard Shortcuts" aria-label="Shortcuts Help">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Screen Display -->
      <section class="display-container" aria-live="polite">
        <div class="display-previous" id="displayPrevious" title="Previous calculation"></div>
        <div class="display-main">
          <input 
            type="text" 
            id="expressionInput" 
            class="expression-input" 
            placeholder="0" 
            autocomplete="off" 
            spellcheck="false" 
            aria-label="Mathematical Expression"
          />
        </div>
        <div class="display-footer">
          <div class="live-preview" id="livePreview"></div>
          <button id="btnCopyResult" class="copy-btn" title="Copy result to clipboard" aria-label="Copy result">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-feedback">Copied!</span>
          </button>
        </div>
      </section>

      <!-- Error / Alert Banner -->
      <div id="errorBanner" class="error-banner hidden" role="alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text" id="errorText"></span>
      </div>

      <!-- Keypads Container -->
      <div class="keypads-wrapper">
        <!-- Scientific Keypad Panel -->
        <section class="keypad scientific-keypad hidden" id="scientificKeypad" aria-label="Scientific Functions">
          <button class="key fn-key" data-insert="sin(">sin</button>
          <button class="key fn-key" data-insert="cos(">cos</button>
          <button class="key fn-key" data-insert="tan(">tan</button>
          <button class="key fn-key" data-insert="asin(">sin⁻¹</button>
          <button class="key fn-key" data-insert="acos(">cos⁻¹</button>
          <button class="key fn-key" data-insert="atan(">tan⁻¹</button>

          <button class="key fn-key" data-insert="sqrt(">√x</button>
          <button class="key fn-key" data-insert="cbrt(">∛x</button>
          <button class="key fn-key" data-insert="^2">x²</button>
          <button class="key fn-key" data-insert="^3">x³</button>
          <button class="key fn-key" data-insert="^">xʸ</button>
          <button class="key fn-key" data-insert="fact(">n!</button>

          <button class="key fn-key" data-insert="ln(">ln</button>
          <button class="key fn-key" data-insert="log(">log₁₀</button>
          <button class="key fn-key" data-insert="exp(">eˣ</button>
          <button class="key fn-key" data-insert="abs(">|x|</button>
          <button class="key const-key" data-insert="pi">π</button>
          <button class="key const-key" data-insert="e">e</button>
        </section>

        <!-- Standard Keypad -->
        <section class="keypad standard-keypad" id="standardKeypad" aria-label="Standard Keypad">
          <!-- Row 1 -->
          <button class="key action-key clear-key" id="btnClear" title="Clear All (Escape)">AC</button>
          <button class="key action-key delete-key" id="btnBackspace" title="Backspace (Delete)">⌫</button>
          <button class="key op-key" data-insert="(">(</button>
          <button class="key op-key" data-insert=")">)</button>
          <button class="key op-key" data-insert="%">%</button>

          <!-- Row 2 -->
          <button class="key num-key" data-insert="7">7</button>
          <button class="key num-key" data-insert="8">8</button>
          <button class="key num-key" data-insert="9">9</button>
          <button class="key op-key" data-insert="÷">÷</button>
          <button class="key op-key" data-insert="//">//</button>

          <!-- Row 3 -->
          <button class="key num-key" data-insert="4">4</button>
          <button class="key num-key" data-insert="5">5</button>
          <button class="key num-key" data-insert="6">6</button>
          <button class="key op-key" data-insert="×">×</button>
          <button class="key op-key" data-insert="^">^</button>

          <!-- Row 4 -->
          <button class="key num-key" data-insert="1">1</button>
          <button class="key num-key" data-insert="2">2</button>
          <button class="key num-key" data-insert="3">3</button>
          <button class="key op-key" data-insert="-">−</button>
          <button class="key action-key" id="btnNegate" title="Negate sign">±</button>

          <!-- Row 5 -->
          <button class="key num-key" data-insert="0">0</button>
          <button class="key num-key" data-insert="00">00</button>
          <button class="key num-key" data-insert=".">.</button>
          <button class="key op-key" data-insert="+">+</button>
          <button class="key equals-key" id="btnEquals" title="Calculate (Enter)">=</button>
        </section>
      </div>

      <!-- History Side Drawer -->
      <aside class="history-drawer" id="historyDrawer" aria-label="Calculation History">
        <div class="drawer-header">
          <div class="drawer-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 14 14"></polyline>
            </svg>
            <span>History</span>
          </div>
          <div class="drawer-actions">
            <button id="btnClearHistory" class="text-btn" title="Clear all history">Clear</button>
            <button id="btnCloseHistory" class="icon-btn-sm" aria-label="Close history">✕</button>
          </div>
        </div>

        <div class="history-list" id="historyList">
          <div class="history-empty">No calculations yet</div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Keyboard Shortcuts Modal -->
  <dialog id="helpModal" class="help-dialog">
    <div class="dialog-content">
      <div class="dialog-header">
        <h3>⌨️ Keyboard Shortcuts</h3>
        <button id="btnCloseHelp" class="icon-btn-sm">✕</button>
      </div>
      <table class="shortcuts-table">
        <tbody>
          <tr><td><kbd>0</kbd>–<kbd>9</kbd>, <kbd>.</kbd></td><td>Enter numbers & decimal</td></tr>
          <tr><td><kbd>+</kbd>, <kbd>-</kbd>, <kbd>*</kbd>, <kbd>/</kbd>, <kbd>%</kbd></td><td>Math operators</td></tr>
          <tr><td><kbd>^</kbd></td><td>Exponent / Power</td></tr>
          <tr><td><kbd>(</kbd>, <kbd>)</kbd></td><td>Parentheses</td></tr>
          <tr><td><kbd>Enter</kbd> or <kbd>=</kbd></td><td>Calculate result</td></tr>
          <tr><td><kbd>Backspace</kbd></td><td>Delete previous character</td></tr>
          <tr><td><kbd>Esc</kbd></td><td>Clear expression</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>H</kbd></td><td>Toggle history drawer</td></tr>
          <tr><td><kbd>Ctrl</kbd>+<kbd>C</kbd></td><td>Copy result</td></tr>
        </tbody>
      </table>
    </div>
  </dialog>

  <script src="/static/js/calculator.js"></script>
</body>
</html>
